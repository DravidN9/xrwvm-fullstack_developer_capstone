name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python Syntax
        run: |
          python -m compileall server

      - name: Run Python Linter
        run: |
          flake8 server \
            --ignore=E501,E128,E131,E117,E302,E303,E231,E265,E275,E712,E722,E101,W191,W291,W292,W293,W391,F401,F811,F841
          echo "Linted all the Python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: Install JSHint
        run: npm install jshint --global

      - name: Run JavaScript Linter
        run: |
          find ./server/database -name "*.js" -exec jshint --esversion 8 {} +
          echo "Linted all the JavaScript files successfully"